{% include base_path %}

<!-- start custom head snippets -->

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>
{% if page.noindex %}<meta name="robots" content="noindex, follow"/>{% endif %}
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/site-redesign.css"/>

{% if page.url == "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "dateModified": "2026-08-31",
  "mainEntity": {
    "@id": {{ site.url | append: site.baseurl | append: "/#person" | jsonify }},
    "@type": "Person",
    "name": "Moonseong Jeong",
    "alternateName": ["Bronson Jeong", "Moonseong (Bronson) Jeong", "정문성"],
    "identifier": "https://orcid.org/0009-0009-3836-2676",
    "url": {{ site.url | append: site.baseurl | append: "/" | jsonify }},
    "image": {{ site.url | append: site.baseurl | append: "/images/profile.jpg" | jsonify }},
    "jobTitle": "PhD Candidate in Computer Science",
    "award": [
      "ICML 2025 Spotlight selection for RAPTOR",
      "UCLA Computer Science Departmental Fellowship"
    ],
    "affiliation": {
      "@type": "CollegeOrUniversity",
      "name": "University of California, Los Angeles",
      "sameAs": "https://www.ucla.edu/"
    },
    "description": {{ page.description | default: site.description | jsonify }},
    "knowsAbout": [
      "Computational genomics",
      "Biomedical machine learning",
      "Statistical genetics",
      "Biobank-scale inference",
      "3D medical imaging",
      "Electronic health records",
      "Prescription drug monitoring data",
      "High-performance computing",
      "Secure on-premises health-data pipelines"
    ],
    "sameAs": [
      "https://scholar.google.com/citations?user=raOG4TkAAAAJ&hl=en&oi=ao",
      "https://orcid.org/0009-0009-3836-2676",
      "https://dblp.org/pid/377/0041.html",
      "https://www.semanticscholar.org/author/Moonseong-Jeong/2254362634",
      "https://www.linkedin.com/in/bronsonj98",
      "https://github.com/bronsonj98"
    ],
    "subjectOf": {
      "@type": "DigitalDocument",
      "name": "Curriculum Vitae of Moonseong Jeong",
      "url": "https://drive.google.com/file/d/1xEPaaoC0gFbqNf6RriW_DX6pGO03WTZZ/view?usp=sharing"
    }
  }
}
</script>
{% elsif page.collection == "publications" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ScholarlyArticle",
  "headline": {{ page.title | jsonify }},
  "url": {{ site.url | append: site.baseurl | append: page.url | jsonify }},
  {% unless page.publication_status == "in-preparation" %}"datePublished": {{ page.date | date: "%Y-%m-%d" | jsonify }},{% endunless %}
  {% if page.paperurl and page.paperurl != "#" %}"sameAs": {{ page.paperurl | jsonify }},{% endif %}
  {% if page.excerpt %}"description": {{ page.excerpt | markdownify | strip_html | strip_newlines | jsonify }},{% endif %}
  "author": {
    "@id": {{ site.url | append: site.baseurl | append: "/#person" | jsonify }},
    "@type": "Person",
    "name": "Moonseong Jeong",
    "alternateName": "Bronson Jeong"
  }
}
</script>
{% endif %}


<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- end custom head snippets -->
